name: CD — Deploy to GCP VPS

on:
  push:
    branches: [main]

# Only one deploy at a time
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    # Only deploy if CI passes (ci.yml runs on the same push)
    # The deploy itself re-pulls and builds on the VPS

    environment:
      name: production
      url: http://${{ secrets.VPS_IP }}:3000

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            cd /opt/quizapp
            bash deploy/deploy.sh
