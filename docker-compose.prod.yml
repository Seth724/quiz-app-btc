# Production Docker Compose for QuizApp with Bitcoin Computer
#
# DEPLOYMENT (on GCP VPS):
#   1. Clone repo:  git clone <repo-url> /opt/quizapp && cd /opt/quizapp
#   2. Copy env:    cp .env.bcn.template .env.bcn  (edit if needed)
#   3. Copy env:    cp .env.api.template .env.api  (edit with your values)
#   4. Copy env:    cp .env.web.template .env.web  (edit with your VPS public IP)
#   5. Build web:   set -a && source .env.web && set +a && docker compose -f docker-compose.prod.yml build quiz-web
#      NOTE: Must load .env.web into shell env before build (NEXT_PUBLIC_* vars are baked at build time)
#   6. Start all:   docker compose -f docker-compose.prod.yml up -d
#   7. Deploy contracts: (after BCN is healthy)
#   8. Update .env.web and .env.api with contract mod specs, then rebuild web

services:
  # ───────────────────────────────────────
  # Bitcoin Computer Local Node Stack
  # ───────────────────────────────────────

  bcn-db:
    image: postgres:15
    container_name: quiz-bcn-db
    restart: always
    environment:
      POSTGRES_USER: bcn
      POSTGRES_PASSWORD: bcn
      POSTGRES_DB: bcn
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bcn']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '5432:5432'
    networks:
      - bcn-network
    volumes:
      - bcn-db-data:/var/lib/postgresql/data

  bcn-node:
    image: bcdb/litecoind-regtest:0.21.2.2
    container_name: quiz-bitcoin-node
    restart: always
    ports:
      - '19332:19332'
      - '19444:19444'
      - '28332:28332'
    volumes:
      - bcn-blockchain-data:/home/litecoin/.litecoin
      - ./bcn-setup/litecoin.conf:/home/litecoin/.litecoin/litecoin.conf:ro
    networks:
      - bcn-network

  # One-shot: push Prisma schema to PostgreSQL (creates tables)
  bcn-migrate:
    image: bcdb/bcn:latest
    container_name: quiz-bcn-migrate
    working_dir: /dist/packages/node
    command: >
      sh -c '
        echo "=== BCN Database Migration ===" &&
        SCHEMA=$(find /dist -name "schema.prisma" -type f 2>/dev/null | head -1) &&
        if [ -n "$SCHEMA" ]; then
          echo "Found Prisma schema at: $SCHEMA" &&
          cd "$(dirname "$SCHEMA")/.." &&
          npx prisma db push --schema "$SCHEMA" --accept-data-loss --skip-generate 2>&1 &&
          echo "Database tables created successfully."
        else
          echo "No Prisma schema found. Checking for SQL files..." &&
          find /dist -name "*.sql" -type f 2>/dev/null | head -20 &&
          echo "Manual schema creation may be needed."
        fi
      '
    environment:
      - DATABASE_URL=postgresql://bcn:bcn@bcn-db:5432/bcn
    depends_on:
      bcn-db:
        condition: service_healthy
    networks:
      - bcn-network
    restart: "no"

  bcn:
    image: bcdb/bcn:latest
    container_name: quiz-bcn
    env_file: .env.bcn
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:1031/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: npm run start:bcn
    working_dir: /dist/packages/node
    ports:
      - '1031:1031'
    environment:
      - BCN_CHAIN=LTC
      - BCN_NETWORK=regtest
      - BCN_ENV=dev
      - BCN_URL=http://bcn:1031
      - BCN_ZMQ_URL=tcp://bcn-node:28332
      - BITCOIN_RPC_HOST=bcn-node
      - BITCOIN_RPC_PORT=19332
      - BITCOIN_RPC_PROTOCOL=http
      - BITCOIN_RPC_USER=bcn-admin
      - BITCOIN_RPC_PASSWORD=kH4nU5Okm6-uyC0_mA5ztVNacJqZbYd_KGLl6mx722A=
      - POSTGRES_PORT=5432
      - POSTGRES_HOST=bcn-db
      - POSTGRES_USER=bcn
      - POSTGRES_PASSWORD=bcn
      - POSTGRES_DB=bcn
    depends_on:
      bcn-db:
        condition: service_healthy
      bcn-node:
        condition: service_started
      bcn-migrate:
        condition: service_completed_successfully
    networks:
      - bcn-network
    volumes:
      - bcn-logs:/dist/packages/node/logs

  bcn-sync:
    image: bcdb/bcn:latest
    container_name: quiz-bcn-sync
    env_file: .env.bcn
    restart: always
    command: npm run start:sync
    working_dir: /dist/packages/node
    environment:
      - BCN_CHAIN=LTC
      - BCN_NETWORK=regtest
      - BCN_ENV=dev
      - BCN_URL=http://bcn:1031
      - BCN_ZMQ_URL=tcp://bcn-node:28332
      - BCN_WORKER_ID=1
      - BCN_NUM_WORKERS=1
      - BITCOIN_RPC_HOST=bcn-node
      - BITCOIN_RPC_PORT=19332
      - BITCOIN_RPC_PROTOCOL=http
      - BITCOIN_RPC_USER=bcn-admin
      - BITCOIN_RPC_PASSWORD=kH4nU5Okm6-uyC0_mA5ztVNacJqZbYd_KGLl6mx722A=
      - POSTGRES_PORT=5432
      - POSTGRES_HOST=bcn-db
      - POSTGRES_USER=bcn
      - POSTGRES_PASSWORD=bcn
      - POSTGRES_DB=bcn
    depends_on:
      bcn-db:
        condition: service_healthy
      bcn:
        condition: service_healthy
      bcn-migrate:
        condition: service_completed_successfully
    networks:
      - bcn-network
    volumes:
      - bcn-logs:/dist/packages/node/logs

  # ───────────────────────────────────────
  # QuizApp API (NestJS + Prisma + MongoDB)
  # ───────────────────────────────────────

  quiz-api:
    container_name: quiz-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    env_file: .env.api
    ports:
      - '3002:3002'
    environment:
      - NODE_ENV=production
      - PORT=3002
      - BLOCKCHAIN_URL=http://bcn:1031
      - BLOCKCHAIN_CHAIN=LTC
      - BLOCKCHAIN_NETWORK=regtest
    depends_on:
      bcn:
        condition: service_healthy
    networks:
      - bcn-network
      - quiz-network
    volumes:
      - api-logs:/app/logs
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3002/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ───────────────────────────────────────
  # QuizApp Web (Next.js Standalone)
  # ───────────────────────────────────────

  quiz-web:
    container_name: quiz-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # IMPORTANT: Build args read from shell environment. Load .env.web first:
      #   set -a && source .env.web && set +a
      # Or use: docker compose --env-file .env.web build quiz-web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_CHAIN: ${NEXT_PUBLIC_CHAIN:-LTC}
        NEXT_PUBLIC_NETWORK: ${NEXT_PUBLIC_NETWORK:-regtest}
        NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL}
        NEXT_PUBLIC_TEACHER_MOD_SPEC: ${NEXT_PUBLIC_TEACHER_MOD_SPEC:-}
        NEXT_PUBLIC_STUDENT_MOD_SPEC: ${NEXT_PUBLIC_STUDENT_MOD_SPEC:-}
        NEXT_PUBLIC_QUIZ_MOD_SPEC: ${NEXT_PUBLIC_QUIZ_MOD_SPEC:-}
        NEXT_PUBLIC_QUIZ_ATTEMPT_MOD_SPEC: ${NEXT_PUBLIC_QUIZ_ATTEMPT_MOD_SPEC:-}
        NEXT_PUBLIC_PAYMENT_MOD_SPEC: ${NEXT_PUBLIC_PAYMENT_MOD_SPEC:-}
        NEXT_PUBLIC_QUIZ_ACCESS_MOD_SPEC: ${NEXT_PUBLIC_QUIZ_ACCESS_MOD_SPEC:-}
        NEXT_PUBLIC_QUIZ_ACCESS_SALE_MOD_SPEC: ${NEXT_PUBLIC_QUIZ_ACCESS_SALE_MOD_SPEC:-}
    restart: always
    env_file: .env.web
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
    depends_on:
      quiz-api:
        condition: service_healthy
    networks:
      - bcn-network
      - quiz-network

networks:
  bcn-network:
    driver: bridge
  quiz-network:
    driver: bridge

volumes:
  bcn-db-data:
  bcn-blockchain-data:
  bcn-logs:
  api-logs:
